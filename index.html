<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metalmeccanica Falcone – Proposte grafiche</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #e9eef0;
    color: #12343b;
  }

  /* Barra superiore */
  .bar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    flex-flow: row wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 10px 20px;
    background: #12343b;
    color: #fff;
    font-size: 14px;
  }

  .bar a {
    color: #fff;
    text-decoration: none;
  }

  .bar-proposte {
    display: flex;
    flex-flow: row nowrap;
    justify-content: flex-start;
    align-items: center;
    gap: 8px;
  }

  .bar-proposte a {
    padding: 6px 14px;
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 4px;
  }

  .bar-proposte a.attiva {
    background: #d7141a;
    border-color: #d7141a;
  }

  .bar-pagine {
    display: flex;
    flex-flow: row wrap;
    justify-content: flex-end;
    align-items: center;
    gap: 16px;
  }

  .bar-pagine a {
    opacity: 0.7;
  }

  .bar-pagine a.attiva {
    opacity: 1;
    border-bottom: 2px solid #d7141a;
  }

  /* Schermata */
  .schermata {
    display: flex;
    flex-flow: column nowrap;
    justify-content: flex-start;
    align-items: center;
    padding: 30px 20px 60px;
  }

  .tavola {
    position: relative;
    width: 100%;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
  }

  .tavola img {
    display: block;
    width: 100%;
  }

  .hotspot {
    position: absolute;
    display: block;
    border-radius: 4px;
  }

  .hotspot:hover {
    background: rgba(215, 20, 26, 0.08);
  }

  .tavola.mostra-link .hotspot {
    background: rgba(215, 20, 26, 0.2);
    outline: 2px solid #d7141a;
  }

  /* Popup progetto */
  .popup {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 20;
    display: none;
    flex-flow: row nowrap;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
    padding: 20px;
    background: rgba(18, 52, 59, 0.6);
  }

  .popup.aperto {
    display: flex;
  }

  .popup-box {
    position: relative;
    width: 100%;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  }

  .popup-box img {
    display: block;
    width: 100%;
  }

  /* Pagina iniziale */
  .intro {
    max-width: 1100px;
    margin: 0 auto;
    padding: 60px 20px;
  }

  .intro h1 {
    margin-bottom: 8px;
    font-size: 32px;
  }

  .intro p {
    margin-bottom: 40px;
    color: #4a6268;
  }

  .scelte {
    display: flex;
    flex-flow: row wrap;
    justify-content: center;
    align-items: stretch;
    gap: 30px;
  }

  .scelta {
    display: flex;
    flex-flow: column nowrap;
    justify-content: flex-start;
    align-items: stretch;
    width: 480px;
    background: #fff;
    color: #12343b;
    text-decoration: none;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
  }

  .scelta-img {
    height: 420px;
    overflow: hidden;
  }

  .scelta-img img {
    display: block;
    width: 100%;
  }

  .scelta-testo {
    padding: 20px 24px;
    border-top: 4px solid #d7141a;
  }

  .scelta-testo h2 {
    margin-bottom: 4px;
    font-size: 22px;
  }

  .scelta-testo span {
    color: #d7141a;
    font-weight: bold;
  }

  .scelta:hover .scelta-testo h2 {
    color: #d7141a;
  }
</style>
</head>
<body>

  // Menu in alto: y = centro del testo, voci = { pagina: [x inizio, x fine] }
  function menu(y, voci) {
    return Object.keys(voci).map(function (pagina) {
      return [voci[pagina][0] - 6, y - 13, voci[pagina][1] + 6, y + 13, pagina];
    });
  }

  // Colonna di link nel footer
  function colonna(x1, x2, ys, pagine) {
    return ys.map(function (y, i) {
      return [x1 - 4, y - 9, x2 + 4, y + 9, pagine[i]];
    });
  }

  function footer(xSx, xDx, ys) {
    return colonna(xSx, xSx + 55, ys, ['home', 'azienda', 'lavorazioni'])
      .concat(colonna(xDx, xDx + 50, ys, ['settori', 'qualita', 'contatti']));

            ...menu(28, { home: [307, 341], azienda: [365, 411], lavorazioni: [435, 499], settori: [522, 560], progetti: [586, 632], qualita: [654, 694], contatti: [717, 762] }),

            [31, 541, 341, 1030, 'popup'],
            [364, 541, 673, 1030, 'popup'],
            [696, 541, 1005, 1030, 'popup'],
            [767, 1273, 980, 1320, 'contatti'],
            ...colonna(364, 435, [1370, 1398, 1425], ['home', 'azienda', 'lavorazioni']),
            ...colonna(530, 580, [1370, 1394, 1418, 1442], ['settori', 'progetti', 'qualita', 'contatti'])

  };

  const app = document.getElementById('app');

  function percento(valore, totale) {
    return (valore / totale * 100) + '%';
  }

  // Aree cliccabili: una pagina, un popup ('popup', con il numero del popup se ce n'è più di uno) o la chiusura ('chiudi')
  function creaLink(lista, w, h, idProposta) {
    let html = '';
    lista.forEach(function (l) {
      const stile = 'left:' + percento(l[0], w) + ';' +
        'top:' + percento(l[1], h) + ';' +
        'width:' + percento(l[2] - l[0], w) + ';' +
        'height:' + percento(l[3] - l[1], h) + ';';

      if (l[4] === 'popup') {
        html += '<a class="hotspot" href="#" data-azione="popup" data-popup="' + (l[5] || 0) + '" style="' + stile + '"></a>';
      } else if (l[4] === 'chiudi') {
        html += '<a class="hotspot" href="#" data-azione="chiudi" style="' + stile + '"></a>';
      } else {
        html += '<a class="hotspot" href="#' + idProposta + '/' + l[4] + '" title="' + NOMI[l[4]] + '" style="' + stile + '"></a>';
      }
    });
    return html;
  }

  function mostraIntro() {
    document.title = 'Metalmeccanica Falcone – Proposte grafiche';
    app.innerHTML =
      '<div class="intro">' +
        '<h1>Metalmeccanica Falcone</h1>' +
        '<p>Due proposte grafiche per il nuovo sito. Scegli una proposta e naviga tra le pagine cliccando sul menu e sui bottoni.</p>' +
        '<div class="scelte">' +
          '<a class="scelta" href="#a/home">' +
            '<div class="scelta-img"><img src="img/proposta-a/home.jpg" alt="Proposta A"></div>' +
            '<div class="scelta-testo"><h2>Proposta A</h2><span>Apri la proposta →</span></div>' +
          '</a>' +
          '<a class="scelta" href="#b/home">' +
            '<div class="scelta-img"><img src="img/proposta-b/home.jpg" alt="Proposta B"></div>' +
            '<div class="scelta-testo"><h2>Proposta B</h2><span>Apri la proposta →</span></div>' +
          '</a>' +
        '</div>' +
      '</div>';
  }

  function mostraPagina(idProposta, idPagina) {
    const proposta = PROPOSTE[idProposta];
    const pagina = proposta.pagine[idPagina];
    document.title = proposta.nome + ' – ' + NOMI[idPagina];

    let proposteHtml = '<a href="#">← Proposte</a>';
    Object.keys(PROPOSTE).forEach(function (id) {
      const classe = id === idProposta ? ' class="attiva"' : '';
      proposteHtml += '<a href="#' + id + '/' + idPagina + '"' + classe + '>' + PROPOSTE[id].nome + '</a>';
    });

    let pagineHtml = '';
    PAGINE.forEach(function (id) {
      const classe = id === idPagina ? ' class="attiva"' : '';
      pagineHtml += '<a href="#' + idProposta + '/' + id + '"' + classe + '>' + NOMI[id] + '</a>';
    });

    const linkHtml = creaLink(pagina.link, pagina.w, pagina.h, idProposta);

    // Un popup o un elenco di popup; ogni popup può indicare la sua immagine
    let popups = [];
    if (pagina.popup) {
      popups = Array.isArray(pagina.popup) ? pagina.popup : [pagina.popup];
    }

    let popupHtml = '';
    popups.forEach(function (p, i) {
      const immagine = p.img || idPagina + '-popup';
      popupHtml +=
        '<div class="popup" data-popup="' + i + '">' +
          '<div class="popup-box" style="max-width:' + p.w + 'px">' +
            '<img src="img/proposta-' + idProposta + '/' + immagine + '.jpg" alt="Dettaglio">' +
            creaLink(p.link, p.w, p.h, idProposta) +
          '</div>' +
        '</div>';
    });

    app.innerHTML =
      '<div class="bar">' +
        '<div class="bar-proposte">' + proposteHtml + '</div>' +
        '<div class="bar-pagine">' + pagineHtml + '</div>' +
      '</div>' +
      '<div class="schermata">' +
        '<div class="tavola" style="max-width:' + pagina.w + 'px">' +
          '<img src="img/proposta-' + idProposta + '/' + idPagina + '.jpg" alt="' + proposta.nome + ' – ' + NOMI[idPagina] + '">' +
          linkHtml +
        '</div>' +
      '</div>' +
      popupHtml;

    // Clic su un punto non cliccabile: evidenzia per un attimo le aree cliccabili
    const tavola = app.querySelector('.tavola');
    tavola.addEventListener('click', function (e) {
      if (e.target.classList.contains('hotspot')) {
        return;
      }
      tavola.classList.add('mostra-link');
      setTimeout(function () {
        tavola.classList.remove('mostra-link');
      }, 700);
    });

    // Popup: il link apre quello con lo stesso numero
    app.querySelectorAll('.tavola [data-azione="popup"]').forEach(function (link) {
      link.addEventListener('click', function (e) {
        e.preventDefault();
        app.querySelector('.popup[data-popup="' + link.dataset.popup + '"]').classList.add('aperto');
      });
    });

    app.querySelectorAll('.popup').forEach(function (popup) {
      popup.querySelector('[data-azione="chiudi"]').addEventListener('click', function (e) {
        e.preventDefault();
        popup.classList.remove('aperto');
      });
      popup.addEventListener('click', function (e) {
        if (e.target === popup) {
          popup.classList.remove('aperto');
        }
      });
    });

    window.scrollTo(0, 0);
  }

  function route() {
    const parti = location.hash.replace('#', '').split('/');
    if (PROPOSTE[parti[0]] && PROPOSTE[parti[0]].pagine[parti[1]]) {
      mostraPagina(parti[0], parti[1]);
    } else {
      mostraIntro();
    }
  }

  window.addEventListener('hashchange', route);
  route();
</script>
</body>
</html>
